<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Prank Demo — Safe</title>
<style>
  :root{
    --bg:#000;
    --green:#7CFC00;
    --muted: rgba(124,252,0,0.08);
    --mono: 'Courier New', Courier, monospace;
  }
  html,body{height:100%;margin:0;background:var(--bg);font-family:var(--mono);overflow:hidden;color:var(--green)}
  /* Matrix-like falling chars */
  .matrix {
    position:fixed;inset:0;z-index:0;
    background:linear-gradient(180deg, rgba(0,0,0,0.85), rgba(0,0,0,0.95));
  }
  .col {
    position:absolute;top:-140%;width:1ch;opacity:0.9;
    animation:drop linear infinite;
    -webkit-text-stroke: 0.3px rgba(0,0,0,0.15);
    font-weight:700;
  }
  @keyframes drop {
    0%{transform:translateY(-140%) rotate(0deg); opacity:0}
    10%{opacity:1}
    100%{transform:translateY(220%) rotate(10deg); opacity:0}
  }

  /* Center card */
  .card {
    position:relative;z-index:2;
    height:100vh;display:flex;align-items:center;justify-content:center;
    pointer-events:none;
  }
  .screen {
    width:min(880px,92vw); max-width:880px; padding:28px;
    border-radius:12px; background: linear-gradient(135deg, rgba(0,0,0,0.6), rgba(10,10,10,0.35));
    box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 80px rgba(124,252,0,0.03) inset;
    border:1px solid rgba(124,252,0,0.06);
    text-align:center;
  }

  /* The hacker text */
  .headline {
    font-size: clamp(28px, 6vw, 68px);
    letter-spacing: .12em;
    color: var(--green);
    text-transform: uppercase;
    margin: 10px 0 4px;
    line-height:1;
    position:relative;
    display:inline-block;
    padding:6px 12px;
    background: linear-gradient(90deg, rgba(124,252,0,0.06), rgba(124,252,0,0.02));
    border-radius:6px;
    pointer-events:auto;
  }

  /* typing caret */
  .type {
    display:inline-block;
    white-space:nowrap;
    overflow:hidden;
    box-sizing:border-box;
    border-right: 2px solid rgba(124,252,0,0.9);
    animation:blink-caret 700ms steps(1) infinite;
  }
  @keyframes blink-caret {
    50%{border-color: transparent}
  }

  /* glitch layers */
  .glitch {
    position:relative;
    display:inline-block;
  }
  .glitch::before, .glitch::after{
    content:attr(data-text);
    position:absolute;left:0;top:0;
    width:100%;
    clip-path: inset(0 0 0 0);
    opacity:0.85;
  }
  .glitch::before{
    transform: translateX(-2px);
    text-shadow: -2px 0 rgba(255,0,0,0.6);
    animation:glitch-anim-1 2.7s infinite linear;
  }
  .glitch::after{
    transform: translateX(2px);
    text-shadow: 2px 0 rgba(0,255,255,0.45);
    animation:glitch-anim-2 3.1s infinite linear;
  }
  @keyframes glitch-anim-1 {
    0%{clip-path: inset(0 0 100% 0); transform:translateX(-2px) skewX(-2deg)}
    5%{clip-path: inset(30% 0 58% 0); transform:translateX(-6px) skewX(-8deg)}
    10%{clip-path: inset(0 0 0 0); transform:translateX(-2px)}
    100%{clip-path: inset(0 0 100% 0)}
  }
  @keyframes glitch-anim-2 {
    0%{clip-path: inset(100% 0 0 0); transform:translateX(2px) skewX(2deg)}
    7%{clip-path: inset(40% 0 40% 0); transform:translateX(6px) skewX(10deg)}
    14%{clip-path: inset(0 0 0 0); transform:translateX(2px)}
    100%{clip-path: inset(100% 0 0 0)}
  }

  .sub {
    margin-top:10px;font-size:14px;opacity:0.7;color:var(--green);
  }

  /* footer tiny hint */
  .note {margin-top:16px;font-size:12px;opacity:0.55;}

  /* responsive tweaks */
  @media (max-width:480px){
    .screen{padding:18px}
  }
</style>
</head>
<body>
  <div class="matrix" aria-hidden="true"></div>

  <div class="card" role="main">
    <div class="screen" aria-live="polite">
      <div id="line" class="headline" aria-hidden="false">
        <span class="glitch" data-text=""></span>
      </div>
      <div class="sub" id="sub">SYSTEM COMPROMISED — visual demo</div>
      <div class="note">This is a harmless prank — no data is requested or collected.</div>
    </div>
  </div>

<script>
/* --------- Matrix columns generator (purely visual) --------- */
(function generateMatrix(){
  const chars = "01#!@%&*-+=/<>?abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
  const container = document.querySelector('.matrix');
  const vw = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
  const columns = Math.floor(vw / 16) + 4;

  for(let i=0;i<columns;i++){
    const col = document.createElement('div');
    col.className = 'col';
    col.style.left = (i*16) + 'px';
    col.style.top = (Math.random()*-160) + '%';
    col.style.fontSize = (10 + Math.random()*18) + 'px';
    col.style.opacity = (0.4 + Math.random()*0.6);
    col.style.animationDuration = (6 + Math.random()*8) + 's';
    col.style.animationDelay = (Math.random()*-12) + 's';
    // fill column with random characters
    const len = 30 + Math.floor(Math.random()*60);
    let txt = '';
    for(let j=0;j<len;j++){
      txt += chars.charAt(Math.floor(Math.random()*chars.length)) + "<br/>";
    }
    col.innerHTML = txt;
    container.appendChild(col);
  }
})();

/* --------- Typing + glitch text --------- */
const phrase = "ID HACKED!";
const display = document.querySelector('.glitch');
const lineWrapper = document.getElementById('line');
display.setAttribute('data-text', phrase);
const sub = document.getElementById('sub');

let i = 0;
function typeStep(){
  // incremental reveal with small random delay for natural feel
  if(i <= phrase.length){
    display.textContent = phrase.slice(0, i);
    i++;
    const delay = 80 + Math.random()*140;
    setTimeout(typeStep, delay);
  } else {
    // after typing finishes add a subtle flicker & small text change
    setTimeout(() => {
      sub.textContent = "ACCESS: simulated — harmful your id";
      // small repeated flicker effect on headline
      lineWrapper.animate([
        { opacity: 1, transform:'translateY(0)'},
        { opacity: 0.2, transform:'translateY(-2px)'},
        { opacity: 1, transform:'translateY(0)'}
      ], { duration: 420, iterations: 6 });
    }, 600);
  }
}
typeStep();

/* Extra: keyboard-simulated random flicker when user presses a key (visual only) */
window.addEventListener('keydown', ()=>{
  document.querySelector('.screen').animate([
    { boxShadow: '0 10px 40px rgba(0,0,0,0.8), 0 0 80px rgba(124,252,0,0.03) inset' },
    { boxShadow: '0 10px 80px rgba(0,0,0,0.9), 0 0 160px rgba(124,252,0,0.12) inset' },
    { boxShadow: '0 10px 40px rgba(0,0,0,0.8), 0 0 80px rgba(124,252,0,0.03) inset' }
  ], { duration: 450, easing:'ease-in-out' });
});
</script>
</body>
</html>
